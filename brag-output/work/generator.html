<html lang="en">
<head>

<body>
<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const TOTAL_FRAMES = 720; // 24.0 seconds @ 30fps
const FPS = 30;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Image preloading
const images = {
  home: new Image(),
  ourWork: new Image(),
  services: new Image(),
  about: new Image(),
  contact: new Image(),
  admin: new Image(),
  mobileShot: new Image(),
  desktopShot: new Image()
};

images.home.src = '/work/ethix_home.png';
images.ourWork.src = '/work/ethix_our_work.png';
images.services.src = '/work/ethix_services.png';
images.about.src = '/work/ethix_about.png';
images.contact.src = '/work/ethix_contact_full.png';
images.admin.src = '/work/ethix_admin_dashboard.png';
images.mobileShot.src = '/screenshots/pagespeed-mobile.png';
images.desktopShot.src = '/screenshots/pagespeed-desktop.png';

async function preloadAssets() {
  await document.fonts.ready;
  const imgPromises = Object.values(images).map(img => {
    return new Promise(resolve => {
      if (img.complete) return resolve();
      img.onload = () => resolve();
      img.onerror = () => resolve();
    });
  });
  await Promise.all(imgPromises);
  console.log('All real EthixWeb assets preloaded.');
}

function clamp(val, min = 0, max = 1) {
  return Math.max(min, Math.min(max, val));
}
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}
function easeInOutQuad(x) {
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
}
function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Global Warm Stone Editorial Background (#ebebeb)
function drawGlobalBackground() {
  ctx.fillStyle = '#ebebeb';
  ctx.fillRect(0, 0, 1920, 1080);

  // Subtle paper grid pattern
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 1920; x += 64) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
  }
  for (let y = 0; y < 1080; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
  }
}

// Global Perimeter Header & Footer (Exact EthixWeb theme)
function drawPerimeterBar(stepName = '1. DESIGN SYSTEM') {
  ctx.save();
  // Header
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(0, 0, 1920, 60);
  ctx.strokeStyle = '#d5d5d5';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(1920, 60); ctx.stroke();

  // Left
  ctx.fillStyle = '#1c1c1c';
  ctx.font = '700 20px "Roobert", sans-serif';
  ctx.fillText('ETHIXWEB', 80, 38);
  ctx.fillStyle = '#c0272d';
  ctx.font = 'italic 16px "RoxboroughCF", serif';
  ctx.fillText('(OPS)', 185, 36);

  // Center Step Indicator
  ctx.fillStyle = 'rgba(192, 39, 45, 0.1)';
  drawRoundedRect(ctx, 810, 12, 300, 36, 18);
  ctx.fill();
  ctx.strokeStyle = 'rgba(192, 39, 45, 0.3)';
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#c0272d';
  ctx.font = '600 13px "Roobert", sans-serif';
  ctx.fillText(stepName, 960, 35);

  // Right Telemetry
  ctx.textAlign = 'right';
  ctx.fillStyle = '#6b7280';
  ctx.font = '500 13px "Roobert", sans-serif';
  ctx.fillText('SEATTLE HQ: 09:24 PST  ·  BANGALORE HUB: 21:54 IST', 1840, 38);

  // Footer
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(0, 1024, 1920, 56);
  ctx.strokeStyle = '#d5d5d5';
  ctx.beginPath(); ctx.moveTo(0, 1024); ctx.lineTo(1920, 1024); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#6b7280';
  ctx.font = '400 13px "Roobert", sans-serif';
  ctx.fillText('WALKTHROUGH: /Documents/collegejobTasks/EthixWeb  ·  ETHIXWEB USA LLC (WYOMING & BANGALORE)', 80, 1058);

  ctx.textAlign = 'right';
  ctx.fillText('LIVE VERCEL DEPLOYMENT: ETHIXWEB-EIGHT.VERCEL.APP', 1840, 1058);
  ctx.restore();
}

// -----------------------------------------------------------------
// SCENE 1: DESIGN SYSTEM TRANSFORMATION (0.0s - 4.5s / frames 0-134)
// -----------------------------------------------------------------
function renderScene1(t, f) {
  drawGlobalBackground();

  const pScene = clamp(t / 0.5);
  const alpha = easeOutCubic(pScene);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Header Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c0272d';
  ctx.font = '600 15px "Roobert", sans-serif';
  ctx.fillText('PROJECT WALKTHROUGH · WHAT WE BUILT', 960, 115);

  ctx.fillStyle = '#1c1c1c';
  ctx.font = '700 48px "Harmond", serif';
  ctx.fillText('From Clunky Retro Grid to Editorial Design', 960, 168);

  ctx.fillStyle = '#6b7280';
  ctx.font = 'italic 22px "RoxboroughCF", serif';
  ctx.fillText('Re-engineered with Roobert Geometric Sans, Roxborough CF Italic, and Harmond Display', 960, 206);

  // Before vs. After comparison bar
  const compY = 245;
  ctx.fillStyle = '#ffffff';
  drawRoundedRect(ctx, 240, compY, 1440, 60, 12);
  ctx.fill();
  ctx.strokeStyle = '#d5d5d5';
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#ef4444';
  ctx.font = '600 14px "Roobert", sans-serif';
  ctx.fillText('✖ OLD (ethixweb-source):', 270, compY + 36);
  ctx.fillStyle = '#6b7280';
  ctx.font = '400 14px "Roobert", sans-serif';
  ctx.fillText('Dark terminal grid, clunky 3D computer, broken forms, zero backend.', 450, compY + 36);

  ctx.fillStyle = '#10b981';
  ctx.font = '600 14px "Roobert", sans-serif';
  ctx.fillText('✔ NEW (EthixWeb):', 990, compY + 36);
  ctx.fillStyle = '#1c1c1c';
  ctx.font = '500 14px "Roobert", sans-serif';
  ctx.fillText('Editorial stone (#ebebeb), 3D vector spiderweb, Neon Postgres & 90+ PageSpeed.', 1130, compY + 36);

  // Showcase real EthixWeb Home Page (ethix_home.png)
  const homeY = 330;
  const homeW = 1440;
  const homeH = 650;
  const homeX = 240;

  // Shadow + Frame
  ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
  ctx.shadowBlur = 35;
  ctx.shadowOffsetY = 15;
  ctx.fillStyle = '#ffffff';
  drawRoundedRect(ctx, homeX, homeY, homeW, homeH, 16);
  ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  ctx.save();
  drawRoundedRect(ctx, homeX, homeY, homeW, homeH, 16);
  ctx.clip();
  if (images.home.complete) {
    ctx.drawImage(images.home, 0, 0, images.home.width, images.home.height, homeX, homeY, homeW, homeH);
  }
  ctx.restore();

  ctx.strokeStyle = '#d0d0d0';
  ctx.lineWidth = 2;
  drawRoundedRect(ctx, homeX, homeY, homeW, homeH, 16);
  ctx.stroke();

  // Floating callout badges over the screenshot
  const badgeY = homeY + 40;
  const badges = [
    { text: '✦ 3D Spiderweb Cursor Physics', x: homeX + 40 },
    { text: '✦ Seattle & Bangalore Live Clocks', x: homeX + 310 },
    { text: '✦ Lenis Smooth Momentum Scroll', x: homeX + 590 }
  ];

  badges.forEach(b => {
    ctx.fillStyle = 'rgba(28, 28, 28, 0.85)';
    drawRoundedRect(ctx, b.x, badgeY, 250, 36, 18);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 12px "Roobert", sans-serif';
    ctx.fillText(b.text, b.x + 18, badgeY + 23);
  });

  ctx.restore();
  drawPerimeterBar('1. DESIGN SYSTEM TRANSFORMATION');
}

// -----------------------------------------------------------------
// SCENE 2: MULTI-PAGE ARCHITECTURE (4.5s - 9.0s / frames 135-269)
// -----------------------------------------------------------------
function renderScene2(t, f) {
  drawGlobalBackground();

  const pScene = clamp((t - 4.5) / 0.5);
  const alpha = easeOutCubic(pScene);

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#c0272d';
  ctx.font = '600 15px "Roobert", sans-serif';
  ctx.fillText('MULTI-PAGE ARCHITECTURE & WORKFLOWS', 960, 115);

  ctx.fillStyle = '#1c1c1c';
  ctx.font = '700 48px "Harmond", serif';
  ctx.fillText('5 Production Pages Designed & Built', 960, 168);

  ctx.fillStyle = '#6b7280';
  ctx.font = 'italic 22px "RoxboroughCF", serif';
  ctx.fillText('Unified design system with consistent perimeter navigation and zero broken routes', 960, 206);

  // 4 Cards showing the real pages built
  const pages = [
    { title: 'Our Work (/our-work)', sub: 'Case studies & interactive project pills', img: images.ourWork, tag: 'CLIENT PROOF' },
    { title: 'Services (/services)', sub: 'Complete 22-service operating catalog', img: images.services, tag: 'OPERATIONS' },
    { title: 'About (/about)', sub: 'India Dual-Shore 24h velocity superpower', img: images.about, tag: 'INDIA STORY' },
    { title: 'Contact (/contact)', sub: 'Interactive live enquiry form with validation', img: images.contact, tag: 'PIPELINE' }
  ];

  const cardW = 345;
  const cardH = 680;
  const startX = 180;
  const gap = 38;

  pages.forEach((p, idx) => {
    const cx = startX + idx * (cardW + gap);
    const cy = 255;

    // Card background
    ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#ffffff';
    drawRoundedRect(ctx, cx, cy, cardW, cardH, 14);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    // Tag Pill
    ctx.fillStyle = 'rgba(192, 39, 45, 0.08)';
    drawRoundedRect(ctx, cx + 20, cy + 20, 110, 26, 13);
    ctx.fill();
    ctx.fillStyle = '#c0272d';
    ctx.font = '700 11px "Roobert", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.tag, cx + 75, cy + 37);

    // Page Title
    ctx.textAlign = 'left';
    ctx.fillStyle = '#1c1c1c';
    ctx.font = '700 20px "Harmond", serif';
    ctx.fillText(p.title, cx + 20, cy + 76);

    ctx.fillStyle = '#6b7280';
    ctx.font = '400 13px "Roobert", sans-serif';
    ctx.fillText(p.sub, cx + 20, cy + 100);

    // Image preview
    const imgY = cy + 120;
    const imgH = cardH - 140;
    ctx.save();
    drawRoundedRect(ctx, cx + 15, imgY, cardW - 30, imgH, 10);
    ctx.clip();
    if (p.img && p.img.complete) {
      ctx.drawImage(p.img, 0, 0, p.img.width, p.img.height * 0.75, cx + 15, imgY, cardW - 30, imgH);
    }
    ctx.restore();

    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    drawRoundedRect(ctx, cx + 15, imgY, cardW - 30, imgH, 10);
    ctx.stroke();

    ctx.strokeStyle = '#d5d5d5';
    drawRoundedRect(ctx, cx, cy, cardW, cardH, 14);
    ctx.stroke();
  });

  ctx.restore();
  drawPerimeterBar('2. MULTI-PAGE ARCHITECTURE');
}

// -----------------------------------------------------------------

  ctx.font = '700 30px "Harmond", serif';

  }
  ctx.restore();

  drawRoundedRect(ctx, leftX + 40, cardY + 180, cardW - 80, 460, 10);
  ctx.stroke();

  // Desktop Card

  ctx.fillStyle = '#ffffff';
  drawRoundedRect(ctx, rightX, cardY, cardW + 80, cardH, 16);
  ctx.fill();
  ctx.strokeStyle = '#d5d5d5'; ctx.stroke();

  }
  ctx.restore();
  ctx.strokeStyle = '#e0e0e0';
  drawRoundedRect(ctx, rightX + 40, cardY + 180, cardW, 460, 10);
  ctx.stroke();

  ctx.restore();
  drawPerimeterBar('4. PERFORMANCE ENGINEERING (90+)');
}

// -----------------------------------------------------------------
// SCENE 5: WALKTHROUGH SUMMARY & SUBMISSION OUTRO (19.0s - 24.0s / frames 570-719)
// -----------------------------------------------------------------
function renderScene5(t, f) {
  drawGlobalBackground();

  // Shutter transition (19.0s to 19.8s)
  const pShutter = clamp((t - 19.0) / 0.8);
  if (pShutter < 1.0) {
    const numShutters = 6;
    const shutterW = 1920 / numShutters;
    const sH = 1080 * easeInOutQuad(pShutter);
    ctx.fillStyle = '#c0272d';
    for (let i = 0; i < numShutters; i++) {
      if (i % 2 === 0) {
        ctx.fillRect(i * shutterW, 0, shutterW + 1, sH);
      } else {
        ctx.fillRect(i * shutterW, 1080 - sH, shutterW + 1, sH);
      }
    }
  }

  const pContent = clamp((t - 19.8) / 0.6);
  const alpha = easeOutCubic(pContent);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Main Settle Showcase Card (Frame 660 / 22.0s is saved as poster)
  const cardW = 1380;
  const cardH = 780;
  const cardX = (1920 - cardW) / 2;
  const cardY = 150;

  ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
  ctx.shadowBlur = 35;
  ctx.shadowOffsetY = 15;
  ctx.fillStyle = '#ffffff';
  drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 20);
  ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = '#d5d5d5'; ctx.stroke();

  // Brand Header
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c0272d';
  ctx.font = '700 16px "Roobert", sans-serif';
  ctx.fillText('ETHIXWEB RE-ENGINEERING & ARCHITECTURE', 960, cardY + 70);

  ctx.fillStyle = '#1c1c1c';
  ctx.font = '700 64px "Harmond", serif';
  ctx.fillText('Project Walkthrough Complete', 960, cardY + 135);

  ctx.fillStyle = '#4b5563';
  ctx.font = 'italic 26px "RoxboroughCF", serif';
  ctx.fillText('"We run the tech. You run the business."', 960, cardY + 180);

  // 4 Core Deliverables Checklist
  const items = [
    { title: '1. Production Deployment', desc: 'Live globally on Vercel Edge CDN', link: 'https://ethixweb-eight.vercel.app/' },
    { title: '2. Public GitHub Repository', desc: 'Zero secrets, clean atomic Git commits', link: 'https://github.com/Akshat12416/ethixweb' },
    { title: '3. Full Database Pipeline', desc: 'Neon PostgreSQL + 3-tier bot defense', link: '/admin (passcode: ethix2026)' },
    { title: '4. PageSpeed Verified Audits', desc: '0ms Total Blocking Time, 0 CLS', link: '90 Mobile  ·  96 Desktop' }
  ];

  const gridY = cardY + 235;
  const itemW = 590;
  const itemH = 145;

  items.forEach((item, idx) => {
    const col = idx % 2;
    const row = Math.floor(idx / 2);
    const ix = cardX + 70 + col * (itemW + 60);
    const iy = gridY + row * (itemH + 30);

    ctx.fillStyle = '#f8f8f8';
    drawRoundedRect(ctx, ix, iy, itemW, itemH, 12);
    ctx.fill();
    ctx.strokeStyle = '#e5e7eb'; ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#10b981';
    ctx.font = '700 22px "Roobert", sans-serif';
    ctx.fillText('✔  ' + item.title, ix + 25, iy + 45);

    ctx.fillStyle = '#6b7280';
    ctx.font = '400 16px "Roobert", sans-serif';
    ctx.fillText(item.desc, ix + 25, iy + 80);

    ctx.fillStyle = '#1c1c1c';
    ctx.font = '600 16px monospace';
    ctx.fillText(item.link, ix + 25, iy + 115);
  });

  // Bottom Badge
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c0272d';
  ctx.font = '600 16px "Roobert", sans-serif';
  ctx.fillText('Built with React 19 · Vite 8 · Tailwind v4 · GSAP · Lenis · Neon PostgreSQL', 960, cardY + cardH - 50);

  ctx.restore();
  drawPerimeterBar('5. SUBMISSION DELIVERABLES');
}

// -----------------------------------------------------------------
// MAIN RENDER LOOP
// -----------------------------------------------------------------
function renderFrame(f) {
  const t = f / FPS;
  ctx.clearRect(0, 0, 1920, 1080);

  if (f < 135) {
    renderScene1(t, f);
  } else if (f < 270) {
    renderScene2(t, f);
  } else if (f < 420) {
    renderScene3(t, f);
  } else if (f < 570) {
    renderScene4(t, f);
  } else {
    renderScene5(t, f);
  }
}

async function startRender() {
  await preloadAssets();
  console.log('Rendering 720 frames (24.0s @ 30fps)...');

  for (let f = 0; f < TOTAL_FRAMES; f++) {
    renderFrame(f);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.96));
    await fetch('/frame?i=' + f, { method: 'POST', body: blob });
    if (f % 60 === 0) {
      console.log(`Rendered frame ${f} / ${TOTAL_FRAMES} (${(f/30).toFixed(1)}s)`);
    }
  }

  console.log('Finished all frames. Calling /done...');
  await fetch('/done', { method: 'POST' });
}

window.onload = startRender;
</script>
