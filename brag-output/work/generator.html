<body>
<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const TOTAL_FRAMES = 660; // 22.0 seconds @ 30fps
const FPS = 30;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Image preloading
const images = {
  emblem: new Image(),
  spiderweb: new Image(),
  mobileShot: new Image(),
  desktopShot: new Image()
};

images.emblem.src = '/assets/emblem-transparent.webp';
images.spiderweb.src = '/assets/spiderweb.svg';
images.mobileShot.src = '/screenshots/pagespeed-mobile.png';
images.desktopShot.src = '/screenshots/pagespeed-desktop.png';

async function preloadAssets() {
  await document.fonts.ready;
  const imgPromises = Object.values(images).map(img => {
    return new Promise(resolve => {
      if (img.complete) return resolve();
      img.onload = () => resolve();
      img.onerror = () => resolve(); // continue even if fallback
    });
  });
  await Promise.all(imgPromises);
  console.log('All fonts and images preloaded.');
}

// Easing functions
function clamp(val, min = 0, max = 1) {
  return Math.max(min, Math.min(max, val));
}
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}
function easeInOutQuad(x) {
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
}
function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function easeOutExpo(x) {
  return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
}

// Helper drawing utilities
function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Draw Background with tech grid & crimson ambient glow
function drawGlobalBackground(t, theme = 'dark') {
  if (theme === 'dark') {
    ctx.fillStyle = '#0b0c0f';
    ctx.fillRect(0, 0, 1920, 1080);

    // Subtle grid lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    const offset = (t * 15) % gridSize;
    for (let x = offset; x < 1920; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, 1080);
      ctx.stroke();
    }
    for (let y = offset; y < 1080; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(1920, y);
      ctx.stroke();
    }

    // Crimson ambient corner flares
    const grad = ctx.createRadialGradient(960, 540, 50, 960, 540, 900);
    grad.addColorStop(0, 'rgba(192, 39, 45, 0.12)');
    grad.addColorStop(0.6, 'rgba(192, 39, 45, 0.02)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1920, 1080);
  } else {
    // Warm editorial stone `#ebebeb`
    ctx.fillStyle = '#ebebeb';
    ctx.fillRect(0, 0, 1920, 1080);

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 1920; x += 80) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, 1080);
      ctx.stroke();
    }
  }
}

// Global persistent perimeter header & footer
function drawPerimeterBar(t, activeTab = 'HOME') {
  ctx.save();
  // Header bar
  ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.fillRect(0, 0, 1920, 64);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.beginPath(); ctx.moveTo(0, 64); ctx.lineTo(1920, 64); ctx.stroke();

  // Top Left Brand
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 20px "Roobert", sans-serif';
  ctx.fillText('ETHIXWEB', 80, 40);
  ctx.fillStyle = '#c0272d';
  ctx.font = 'italic 16px "RoxboroughCF", serif';
  ctx.fillText('(OPS)', 185, 38);

  // Top Right Telemetry
  ctx.fillStyle = '#9ca3af';
  ctx.font = '500 13px "Roobert", sans-serif';
  ctx.fillText('SEATTLE HQ: 09:18 PST', 1520, 40);
  ctx.fillStyle = '#4ade80';
  ctx.beginPath(); ctx.arc(1710, 36, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9ca3af';
  ctx.fillText('BLR HUB: 21:48 IST', 1725, 40);

  // Footer bar
  ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.fillRect(0, 1024, 1920, 56);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.beginPath(); ctx.moveTo(0, 1024); ctx.lineTo(1920, 1024); ctx.stroke();

  ctx.fillStyle = '#6b7280';
  ctx.font = '400 13px "Roobert", sans-serif';
  ctx.fillText('ETHIXWEB USA LLC · WYOMING · KENT, WA & BANGALORE, IN', 80, 1058);
  ctx.fillText('LIVE DEMO: ETHIXWEB-EIGHT.VERCEL.APP', 1540, 1058);
  ctx.restore();
}

// -------------------------------------------------------------
// SCENE 1: THE PROVOCATION & REVEAL (0.0s - 4.0s / frames 0-119)
// -------------------------------------------------------------
function renderScene1(t, f) {
  drawGlobalBackground(t, 'dark');

  // Ambient web rotating gently in background
  if (images.spiderweb.complete) {
    ctx.save();
    ctx.translate(960, 540);
    ctx.rotate(t * 0.1);
    ctx.globalAlpha = Math.min(0.25, t * 0.15);
    ctx.drawImage(images.spiderweb, -350, -350, 700, 700);
    ctx.restore();
  }

  if (t < 1.6) {
    // Phase A: The Provocation
    const pIntro = clamp(t / 0.5);
    const alpha = easeOutCubic(pIntro);
    
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = alpha;

    ctx.fillStyle = '#9ca3af';
    ctx.font = '500 16px "Roobert", sans-serif';
    ctx.fillText('THE TRUTH ABOUT OUTSOURCING', 960, 430);

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 56px "Harmond", serif';
    ctx.fillText('Traditional offshore tech is broken.', 960, 510);

    ctx.fillStyle = '#6b7280';
    ctx.font = '400 24px "Roobert", sans-serif';
    ctx.fillText('Timezone lag · Junior delegation · Zero accountability', 960, 570);

    // Crimson slash strike-through at t >= 1.0s
    if (t >= 0.9) {
      const pSlash = clamp((t - 0.9) / 0.35);
      const slashWidth = 840 * easeOutExpo(pSlash);
      ctx.strokeStyle = '#c0272d';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(960 - 420, 502);
      ctx.lineTo(960 - 420 + slashWidth, 502);
      ctx.stroke();

      // Red spark particles
      for (let i = 0; i < 8; i++) {
        const sx = 960 - 420 + slashWidth + (Math.sin(i * 1.5) * 20);
        const sy = 502 + (Math.cos(i * 2.1) * 25);
        ctx.fillStyle = '#ff4d4d';
        ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  } else {
    // Phase B: The Big Reveal (t = 1.6s to 4.0s)
    const pReveal = clamp((t - 1.6) / 0.7);
    const scale = 0.85 + 0.15 * easeOutBack(pReveal);
    const alpha = easeOutCubic(pReveal);

    // Central emblem dropping in
    ctx.save();
    ctx.translate(960, 420);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    if (images.emblem.complete) {
      ctx.shadowColor = 'rgba(192, 39, 45, 0.6)';
      ctx.shadowBlur = 40;
      ctx.drawImage(images.emblem, -80, -80, 160, 160);
      ctx.shadowBlur = 0;
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 84px "Harmond", serif';
    ctx.fillText('Ethix Web', 0, 160);
    ctx.fillStyle = '#c0272d';
    ctx.font = 'italic 34px "RoxboroughCF", serif';
    ctx.fillText('(OPS)', 220, 140);

    ctx.fillStyle = '#d1d5db';
    ctx.font = 'italic 36px "RoxboroughCF", serif';
    ctx.fillText('"We run the tech. You run the business."', 0, 230);

    ctx.fillStyle = '#9ca3af';
    ctx.font = '500 18px "Roobert", sans-serif';
    ctx.fillText('A SENIOR-LED DIGITAL OPERATIONS AGENCY · US LEGAL SOVEREIGNTY', 0, 280);

    // Tag pills
    const pills = ['Headless Cloud Platforms', 'Autonomous AI Agents', 'Direct-Revenue Systems'];
    const pillY = 340;
    const startX = -320;
    pills.forEach((p, idx) => {
      const px = startX + idx * 220;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      drawRoundedRect(ctx, px, pillY, 200, 38, 19);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.stroke();

      ctx.fillStyle = '#e5e7eb';
      ctx.font = '500 13px "Roobert", sans-serif';
      ctx.fillText(p, px + 100, pillY + 24);
    });

    ctx.restore();
  }

  drawPerimeterBar(t, 'HOME');
}

  // Central Connecting Energy Arc
  const arcProgress = (t - 4.0) * 0.8;
  ctx.beginPath();
  ctx.moveTo(660, cardY + 160);

  ctx.strokeStyle = 'rgba(192, 39, 45, 0.4)';

  ctx.stroke();

  // Pulsing energy packets moving across
  for (let pIdx = 0; pIdx < 3; pIdx++) {
    const pPos = ((arcProgress + pIdx * 0.33) % 1.0);
    // Quadratic bezier point
    const bx = (1 - pPos) * (1 - pPos) * 660 + 2 * (1 - pPos) * pPos * 960 + pPos * pPos * 1260;
    const by = (1 - pPos) * (1 - pPos) * (cardY + 160) + 2 * (1 - pPos) * pPos * (cardY + 70) + pPos * pPos * (cardY + 160);
    ctx.fillStyle = '#ff4d4d';

  // Central Badge in between nodes
  ctx.fillStyle = '#16161c';

  ctx.textAlign = 'center';

  // Bottom Terminal Box showing real-time commit stream
  const termY = 640;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';

  // Terminal window dots
  ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(250, termY + 25, 6, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#6b7280'; ctx.font = '500 13px "Roobert", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('ethix-velocity-engine --live-telemetry', 320, termY + 30);

  // Terminal lines typing in
  const lines = [
    { tStart: 4.2, text: '[17:00 PST] Seattle handoff: Sprint scope approved · 4 user stories assigned' },
    { tStart: 5.2, text: '[18:30 PST] Bangalore squad begins deep engineering sprint · Branch: feat/headless-checkout' },

  ];

  lines.forEach((l, idx) => {

      ctx.font = '400 16px monospace';
      ctx.fillText(l.text, 250, lineY);

  ctx.restore();
  drawPerimeterBar(t, 'ABOUT');
}

// -------------------------------------------------------------

// -------------------------------------------------------------
// SCENE 4: PAGESPEED 90+ EVERYWHERE (13.0s - 17.5s / frames 390-524)
// -------------------------------------------------------------
function renderScene4(t, f) {
  drawGlobalBackground(t, 'dark');

  ctx.font = '400 20px "Roobert", sans-serif';

  const dialScoreMobile = Math.floor(easeOutCubic(pDial) * 90);
  const dialScoreDesktop = Math.floor(easeOutCubic(pDial) * 96);

  // Left Card: Mobile 90
  const cardY = 270;

  const cardW = 720;
  const cardH = 680;

  ctx.fillStyle = '#111317';
  drawRoundedRect(ctx, leftX, cardY, cardW, cardH, 18);

  ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
  ctx.stroke();

  // Mobile Badge
  ctx.textAlign = 'left';
  ctx.fillStyle = '#34d399';
  ctx.font = '600 14px "Roobert", sans-serif';
  ctx.fillText('● MOBILE AUDIT (MOTO G POWER · SLOW 4G)', leftX + 45, cardY + 50);

  ctx.fillStyle = '#ffffff';
  ctx.font = '700 32px "Harmond", serif';
  ctx.fillText('Mobile Performance', leftX + 45, cardY + 95);

  // Big Radial Gauge for Mobile
  const dialCenterX = leftX + 170;
  const dialCenterY = cardY + 240;
  const dialRadius = 95;

  ctx.beginPath();
  ctx.arc(dialCenterX, dialCenterY, dialRadius, 0, Math.PI * 2);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.stroke();

  // Green arc
  ctx.beginPath();
  const startAngle = -Math.PI / 2;
  const endAngle = startAngle + (Math.PI * 2 * (dialScoreMobile / 100));
  ctx.arc(dialCenterX, dialCenterY, dialRadius, startAngle, endAngle);
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 14;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 68px "Harmond", serif';
  ctx.fillText(String(dialScoreMobile), dialCenterX, dialCenterY + 22);
  ctx.fillStyle = '#10b981';
  ctx.font = '600 16px "Roobert", sans-serif';
  ctx.fillText('/ 100 🟢', dialCenterX, dialCenterY + 55);

  // Metrics alongside dial
  ctx.textAlign = 'left';
  const metricsM = [
    { label: 'Total Blocking Time (TBT)', val: '0 ms', color: '#10b981' },
    { label: 'Cumulative Layout Shift (CLS)', val: '0', color: '#10b981' },
    { label: 'First Contentful Paint (FCP)', val: '0.8 s', color: '#10b981' },

  metricsM.forEach((m, idx) => {

    ctx.font = '700 18px "Roobert", sans-serif';
    ctx.fillText(m.val, leftX + 320, my + 24);

  // Embedded Screenshot of Mobile report
  if (images.mobileShot.complete) {
    ctx.save();
    drawRoundedRect(ctx, leftX + 40, cardY + 380, 640, 260, 10);
    ctx.clip();
    // Crop upper portion of PageSpeed screenshot showing 90, 94, 100, 92
    ctx.drawImage(images.mobileShot, 0, 0, images.mobileShot.width, images.mobileShot.height * 0.65, leftX + 40, cardY + 380, 640, 260);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    drawRoundedRect(ctx, leftX + 40, cardY + 380, 640, 260, 10);
    ctx.stroke();
  }

  // Right Card: Desktop 96
  const rightX = 940;
  ctx.fillStyle = '#111317';
  drawRoundedRect(ctx, rightX, cardY, cardW, cardH, 18);
  ctx.fill();
  ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';

  ctx.textAlign = 'left';
  ctx.fillStyle = '#34d399';
  ctx.font = '600 14px "Roobert", sans-serif';
  ctx.fillText('● DESKTOP AUDIT (VERIFIED ON VERCEL CDN)', rightX + 45, cardY + 50);

  ctx.fillStyle = '#ffffff';
  ctx.font = '700 32px "Harmond", serif';
  ctx.fillText('Desktop Performance', rightX + 45, cardY + 95);

  const dialRightX = rightX + 170;
  const dialRightY = cardY + 240;

  ctx.beginPath();
  ctx.arc(dialRightX, dialRightY, dialRadius, 0, Math.PI * 2);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.stroke();

  ctx.beginPath();
  const endAngleD = startAngle + (Math.PI * 2 * (dialScoreDesktop / 100));
  ctx.arc(dialRightX, dialRightY, dialRadius, startAngle, endAngleD);
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 14;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 68px "Harmond", serif';
  ctx.fillText(String(dialScoreDesktop), dialRightX, dialRightY + 22);
  ctx.fillStyle = '#10b981';
  ctx.font = '600 16px "Roobert", sans-serif';
  ctx.fillText('/ 100 🟢', dialRightX, dialRightY + 55);

  ctx.textAlign = 'left';
  const metricsD = [
    { label: 'Accessibility', val: '94 / 100 🟢', color: '#10b981' },
    { label: 'Best Practices', val: '100 / 100 🟢', color: '#10b981' },
    { label: 'SEO Optimization', val: '92 / 100 🟢', color: '#10b981' },
    { label: 'Total Blocking Time', val: '30 ms ⚡', color: '#34d399' }
  ];

  metricsD.forEach((m, idx) => {
    const my = cardY + 165 + idx * 48;
    ctx.fillStyle = '#9ca3af';
    ctx.font = '400 14px "Roobert", sans-serif';
    ctx.fillText(m.label, rightX + 320, my);

    ctx.fillStyle = m.color;
    ctx.font = '700 18px "Roobert", sans-serif';
    ctx.fillText(m.val, rightX + 320, my + 24);

  // Embedded Screenshot of Desktop report
  if (images.desktopShot.complete) {
    ctx.save();
    drawRoundedRect(ctx, rightX + 40, cardY + 380, 640, 260, 10);
    ctx.clip();
    ctx.drawImage(images.desktopShot, 0, 0, images.desktopShot.width, images.desktopShot.height * 0.65, rightX + 40, cardY + 380, 640, 260);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    drawRoundedRect(ctx, rightX + 40, cardY + 380, 640, 260, 10);
    ctx.stroke();
  }

  ctx.restore();
  drawPerimeterBar(t, 'PERFORMANCE');
}

// -------------------------------------------------------------
// SCENE 5: SHUTTER OUTRO & CALL TO ACTION (17.5s - 22.0s / frames 525-659)

function renderScene5(t, f) {
  // Shutter transition between 17.5s and 18.3s
  const pShutter = clamp((t - 17.5) / 0.8);

  if (pShutter < 1.0) {
    const numShutters = 6;

    ctx.fillStyle = '#c0272d';
    for (let i = 0; i < numShutters; i++) {
      if (i % 2 === 0) {
        ctx.fillRect(i * shutterW, 0, shutterW + 1, sH);

  // Hover glow effect

// -------------------------------------------------------------
// MAIN FRAME ORCHESTRATOR
// -------------------------------------------------------------
function renderFrame(f) {
  const t = f / FPS;
  ctx.clearRect(0, 0, 1920, 1080);

  if (f < 120) {
    renderScene1(t, f);
  } else if (f < 255) {
    renderScene2(t, f);
  } else if (f < 390) {
    renderScene3(t, f);
  } else if (f < 525) {
    renderScene4(t, f);
  } else {
    renderScene5(t, f);
  }
}

// Render loop running across all frames and posting to server
async function startRender() {
  await preloadAssets();
  console.log('Rendering 660 frames...');

  for (let f = 0; f < TOTAL_FRAMES; f++) {
    renderFrame(f);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.96));
    await fetch('/frame?i=' + f, { method: 'POST', body: blob });
    if (f % 60 === 0) {
      console.log(`Rendered frame ${f} / ${TOTAL_FRAMES} (${(f/30).toFixed(1)}s)`);
    }
  }

  console.log('Finished all frames. Calling /done...');
  await fetch('/done', { method: 'POST' });
}

window.onload = startRender;
