<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1c1c1c" />

    <!-- Primary Meta Tags -->
    <title>Ethixweb — We run the tech. You run the business.</title>
    <meta
      name="description"
      content="Senior-led digital operations and web engineering agency delivering headless web platforms, autonomous AI booking agents, and direct-revenue systems for US businesses."
    />
    <meta
      name="keywords"
      content="Ethixweb, digital operations, headless web, AI voice agents, local SEO, Next.js, React, Twilio AI, ServiceTitan integration, Seattle, Kent WA, Bangalore"
    />
    <meta name="author" content="Ethixweb USA LLC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ethixweb.com/" />
    <meta property="og:title" content="Ethixweb — We run the tech. You run the business." />
    <meta
      property="og:description"
      content="Senior-led digital operations, headless cloud platforms, and autonomous AI booking agents."
    />
    <meta property="og:image" content="/images/case-studies/all-phase-plumbing/devices-mockup-cutout-1024w.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ethixweb — We run the tech. You run the business." />
    <meta
      name="twitter:description"
      content="Senior-led digital operations, headless cloud platforms, and autonomous AI booking agents."
    />

    <!-- Font Preload to Prevent Layout Shifts (CLS) -->
    <link
      rel="preload"
      href="/fonts/Roobert-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/RoxboroughCF-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/RoxboroughCF-RegularItalic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      body { margin: 0; background-color: #ebebeb; color: #1c1c1c; font-family: "Roobert", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .landing-root { width: 100%; min-height: 100svh; background-color: #ebebeb; }
      .landing-hero-stage { position: relative; width: 100%; height: 100svh; min-height: 100svh; overflow: hidden; }
      .nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.4rem; }
      .nav-left, .nav-right { display: none; }
      @media (min-width: 769px) { .nav-left, .nav-right { display: flex; } }
      .nav-center { font-size: 1.55rem; letter-spacing: 0.04em; font-weight: 500; text-decoration: none; color: #1c1c1c; }
      .hello { position: absolute; left: 0; right: 0; top: 12vh; text-align: center; }
      .hello-title { font-size: 13vw; line-height: 1; margin: 0; font-weight: 400; }
      .hello-title-char { display: inline-block; }
      .hello-title .font-sec { font-family: "Roxborough CF", serif; font-style: italic; }
      .hello-title .font-bold { font-family: "Roxborough CF", serif; font-style: normal; }
      .hello-title .badge { font-family: "Roobert", sans-serif; font-size: 2.1vw; vertical-align: super; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="landing-root">
        <div class="landing-hero-stage">
          <header class="nav">
            <div class="nav-left flex items-center gap-2.5">
              <span>DIGITAL OPERATIONS<br />FOR US TEAMS<br />&amp; FOUNDERS</span>
            </div>
            <a href="/" class="nav-center flex items-center gap-2">
              <span>ETHIXWEB.COM</span>
            </a>
            <div class="nav-right">
              USA LLC<br />VOL. 26
            </div>
          </header>
          <section class="hello">
            <h1 class="hello-title">
              <span class="hello-title-mask"><span class="hello-title-char font-sec">E</span></span>
              <span class="hello-title-mask"><span class="hello-title-char font-sec">t</span></span>
              <span class="hello-title-mask"><span class="hello-title-char font-sec">h</span></span>
              <span class="hello-title-mask"><span class="hello-title-char font-sec">i</span></span>
              <span class="hello-title-mask hello-title-mask-space"><span class="hello-title-char font-sec">x</span></span>
              <span class="hello-title-mask"><span class="hello-title-char font-bold">W</span></span>
              <span class="hello-title-mask"><span class="hello-title-char font-bold">e</span></span>
              <span class="hello-title-mask"><span class="hello-title-char font-bold">b</span></span>
              <span class="hello-title-mask hello-title-mask-badge"><span class="hello-title-char badge">(OPS)</span></span>
            </h1>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
